# What this repository publishes: the Mercator Ocean CURRENTS, at the depths this map draws, and nothing else.
#
# **A PEER to ESPC, not a fallback** (`DECISIONS.md` D1). Both models are
# fetched every run and the reader chooses; nothing switches over, and the
# contract's `source` and `modelRun` are what tell a reader which ocean is on
# screen.
#
# **Why its own repository** (D2): the axis that costs bytes is vectors
# against scalars. ESPC's currents are 738.7 MB of tiles against 169.5 MB for
# its five scalar fields, so the two halves have different budgets and
# different failure modes, and sharing a publish gate would let one hold back
# the other.
#
# Two rules inherited from the ESPC siblings, both learned the hard way there:
#
# - **Every `roots` entry here must be one the site's `test-schema.mjs
#   --roots` publishes.** The orchestrator exits 2 on a root the contract does
#   not know, and stops the publish.
# - **A product that leaves takes its files with it.** The stage is seeded
#   from the last publish, so a root a pipeline stops writing is carried
#   forward for ever.
#
# **The credentials are this repository's, not the site's.** The fetcher runs
# here, so `COPERNICUSMARINE_SERVICE_USERNAME` and `_PASSWORD` are secrets on
# this repository. There is no API key. And because this repository is PUBLIC
# while the site is not, everything the fetcher prints goes through its
# `mask()` -- the toolbox announces which account it logged in as.

# **The paths are relative to the site checkout, not to this workspace.** The
# orchestrator runs these with the site checkout as their working directory.
[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 30

# **Its own lane, named for the SERVER.** A lane is a lock: two steps sharing
# one never run together. Copernicus is not HYCOM, so this contends with
# nothing here -- and naming the lane after the service keeps that true when a
# second Copernicus product lands beside it.
[steps.mercator]
cmd = ["python3", "scripts/fetch-mercator.py", "--only=cur-mercator"]
lane = "copernicus"

# **Hours, and they are the upstream's rather than ours.** `max_age_hours`
# measures the reader's distance from the newest published valid time.
# Mercator's currents are 6-hourly and its scalars daily, so the two halves
# are allowed different distances -- copying one number across both would
# make the daily fields look permanently late or the 6-hourly currents look
# permanently fresh.

[products.cur-mercator]
title = "Mercator Ocean currents"
step = "mercator"
# One root per depth, each a list of two grids (u, v) -- the shape the
# ESPC currents already publish. Named for the level that is actually
# there, not for ESPC's nearest: -380m here is 380.21 m, and calling it
# -350m so the two models' filenames matched would put "same word,
# different water" into the contract. The fetcher re-checks them every run.
roots = ["cur-mercator.json", "cur-mercator-47m.json", "cur-mercator-186m.json",
         "cur-mercator-380m.json", "cur-mercator-1062m.json"]
writes = ["cur-mercator*.json"]
max_age_hours = 12
namespace = ["python3", "scripts/fetch-mercator.py", "--namespace", "--only=cur-mercator"]

# **Native resolution, 20 degree boxes, one tier per depth AND per lead.** A
# forecast frame pointing at lead 0's tiles would draw the present at 1/12 deg
# and call it the forecast -- sharp, plausible and wrong -- so the contract
# refuses a lead file whose `tileIndex` is not its own set, and the fetcher
# names the directories accordingly.
#
# **The tiles cost nothing extra upstream.** The fetch already pulls the full
# native global frame in order to decimate it for the overview; a tile is a
# slice of that same array. What they cost is published bytes and the time to
# serialise them, not another read off the service.
[products.cur-mercator.tiles]
build = ["python3", "scripts/fetch-mercator.py", "--tiles", "--only=cur-mercator"]
key = ["python3", "scripts/fetch-mercator.py", "--tile-key", "--only=cur-mercator"]
cache = "mercator-cur-tiles"
match = [
  ["tiles-cur-mercator", "cur-mercator.json"],
  ["tiles-cur-mercator-f*h", "cur-mercator-f*h.json"],
  ["tiles-cur-mercator-47m", "cur-mercator-47m.json"],
  ["tiles-cur-mercator-47m-f*h", "cur-mercator-47m-f*h.json"],
  ["tiles-cur-mercator-186m", "cur-mercator-186m.json"],
  ["tiles-cur-mercator-186m-f*h", "cur-mercator-186m-f*h.json"],
  ["tiles-cur-mercator-380m", "cur-mercator-380m.json"],
  ["tiles-cur-mercator-380m-f*h", "cur-mercator-380m-f*h.json"],
  ["tiles-cur-mercator-1062m", "cur-mercator-1062m.json"],
  ["tiles-cur-mercator-1062m-f*h", "cur-mercator-1062m-f*h.json"],
]
